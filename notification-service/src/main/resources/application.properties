server.port=8084
spring.application.name=notification-service

spring.datasource.url=jdbc:h2:mem:notificationdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.serialization.indent-output=true

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.retail.common.DomainEventMessage
spring.kafka.consumer.properties.spring.json.trusted.packages=com.retail.common
retail.events.publishing.enabled=true
retail.events.outbox.enabled=true
retail.events.topic=notification.events
retail.events.consumer.enabled=true
retail.events.consumer.group-id=notification-order-events
retail.events.order-topic=order.events

customer.service.url=http://localhost:8081
customer.service.path=/customer/
