server.port=8083
spring.application.name=order-service

spring.datasource.url=jdbc:h2:mem:orderdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.serialization.indent-output=true

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
retail.events.publishing.enabled=true
retail.events.outbox.enabled=true
retail.events.topic=order.events

customer.service.url=http://localhost:8081
product.service.url=http://localhost:8082
notification.service.url=http://localhost:8084
