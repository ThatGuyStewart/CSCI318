server.port=8083
spring.application.name=order-service
management.endpoints.web.exposure.include=health,metrics

spring.datasource.url=jdbc:h2:file:./data/orderdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.serialization.indent-output=true

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.streams.application-id=order-projection-v1
spring.kafka.streams.properties[auto.offset.reset]=earliest
spring.kafka.streams.properties[processing.guarantee]=at_least_once
spring.kafka.streams.properties[default.deserialization.exception.handler]=com.retail.common.ProjectionDeserializationExceptionHandler
spring.kafka.streams.properties[retail.events.deserialization.dlt-topic]=order.projection.deserialization.dlt
retail.events.streams.enabled=${RETAIL_EVENTS_STREAMS_ENABLED:true}
retail.projection.replay.enabled=false
retail.events.publishing.enabled=true
retail.events.outbox.enabled=true
retail.events.topic=order.events
retail.events.projection.dlt-topic=order.projection.dlt

customer.service.url=http://localhost:8081
product.service.url=http://localhost:8082
notification.service.url=http://localhost:8084
