components:

&#x20; schemas:

&#x20;   # -------------------------

&#x20;   # Domain Event Envelope

&#x20;   # -------------------------

&#x20;   DomainEventEnvelope:

&#x20;     type: object

&#x20;     properties:

&#x20;       eventId:

&#x20;         type: string

&#x20;         format: uuid

&#x20;       eventType:

&#x20;         type: string

&#x20;       timestamp:

&#x20;         type: string

&#x20;         format: date-time

&#x20;       aggregateId:

&#x20;         type: integer

&#x20;       payload:

&#x20;         type: object

&#x20;         description: Event-specific payload

&#x20;     required:

&#x20;       - eventId

&#x20;       - eventType

&#x20;       - timestamp

&#x20;       - aggregateId

&#x20;       - payload



&#x20;   # -------------------------

&#x20;   # Customer

&#x20;   # -------------------------

&#x20;   Address:

&#x20;     type: object

&#x20;     properties:

&#x20;       unitNumber:

&#x20;         type: integer

&#x20;         nullable: true

&#x20;         minimum: 1

&#x20;       streetNumber:

&#x20;         type: integer

&#x20;         minimum: 1

&#x20;       street:

&#x20;         type: string

&#x20;       suburb:

&#x20;         type: string

&#x20;         nullable: true

&#x20;       city:

&#x20;         type: string

&#x20;       postcode:

&#x20;         type: integer

&#x20;         minimum: 1

&#x20;       state:

&#x20;         type: string

&#x20;       country:

&#x20;         type: string

&#x20;     required:

&#x20;       - streetNumber

&#x20;       - street

&#x20;       - city

&#x20;       - postcode

&#x20;       - state

&#x20;       - country



&#x20;   CustomerCreateRequest:

&#x20;     type: object

&#x20;     required:

&#x20;       - name

&#x20;       - email

&#x20;       - phone

&#x20;       - contactMethod

&#x20;       - address

&#x20;     properties:

&#x20;       name:

&#x20;         type: string

&#x20;       email:

&#x20;         type: string

&#x20;         format: email

&#x20;       phone:

&#x20;         type: integer

&#x20;         minimum: 0

&#x20;       contactMethod:

&#x20;         type: string

&#x20;         enum: \[Email, Phone]

&#x20;       address:

&#x20;         $ref: '#/components/schemas/Address'



