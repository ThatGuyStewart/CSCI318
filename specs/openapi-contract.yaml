openapi: 3.0.3

info:

&#x20; title: Microservice Online Retail Application API Specification

&#x20; description: OpenAPI 3.0 specification for Customer, Product, Order, and Notification microservices. Fully aligned with the provided technical architecture, user stories, domain models, and API endpoint summary.

&#x20; version: 1.0.0



servers:

&#x20; - url: http://localhost:8081

&#x20;   description: Customer Service

&#x20; - url: http://localhost:8082

&#x20;   description: Product Service

&#x20; - url: http://localhost:8083

&#x20;   description: Order Service

&#x20; - url: http://localhost:8084

&#x20;   description: Notification Service



tags:

&#x20; - name: Customer Service

&#x20;   description: Customer records, addresses, and baskets

&#x20; - name: Product Service

&#x20;   description: Product catalog management

&#x20; - name: Order Service

&#x20;   description: Order creation, cancellation, and admin operations

&#x20; - name: Notification Service

&#x20;   description: Customer notifications and broadcasts

&#x20; - name: Events

&#x20;   description: Domain event query endpoints across services



