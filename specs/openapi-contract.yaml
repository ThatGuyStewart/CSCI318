openapi: 3.0.3

info:

  title: Microservice Online Retail Application API Specification

  description: OpenAPI 3.0 specification for Customer, Product, Order, and Notification microservices. Commands persist mutable entities and domain events, with asynchronous Kafka publication through the outbox by default. Most resource queries use eventually consistent projections; basket queries read mutable basket data, event-history queries read persisted events, and recommendations use model tools and in-memory conversation state. Authentication and external email/SMS delivery are not implemented. Use each endpoint's service-specific server.

  version: 1.0.0

x-cqrs: {commandMethods: [POST, PUT, DELETE], queryMethods: [GET], commandAcknowledgement: 'A successful command response confirms event append; projections may lag.', eventTransport: Kafka, publishingTopics: [customer.events, product.events, order.events, notification.events], eventQueryResponse: DomainEventEnvelope}



servers:

- url: http://localhost:8081
  description: Customer Service

- url: http://localhost:8082
  description: Product Service

- url: http://localhost:8083
  description: Order Service

- url: http://localhost:8084
  description: Notification Service



tags:

- name: Customer Service
  description: Customer records, addresses, and baskets

- name: Product Service
  description: Product catalog management

- name: Order Service
  description: Order creation, cancellation, and admin operations

- name: Notification Service
  description: Customer notifications and broadcasts

- name: Events
  description: Domain event query endpoints across services



paths:

