components:
schemas:

  # -------------------------
  # Domain Event Envelope
  # -------------------------

  DomainEventEnvelope:
    type: object
    properties:
      eventId:
        type: string
        format: uuid
      eventType:
        type: string
      aggregateType:
        type: string
      aggregateVersion:
        type: integer
        format: int64
        minimum: 1
      timestamp:
        type: string
        format: date-time
        deprecated: true
        description: Deprecated compatibility field. Use occurredAt.
      occurredAt:
        type: string
        format: date-time
        description: Time at which the domain event occurred.
      correlationId:
        type: string
        format: uuid
        nullable: true
      causationId:
        type: string
        format: uuid
        nullable: true
      aggregateId:
        type: integer
        format: int64
      payload:
          $ref: '#/components/schemas/EventPayload'
    required:
      - eventId
      - eventType
      - aggregateType
      - occurredAt
      - aggregateId
      - aggregateVersion
      - payload

  EventPayload:
    type: object
    description: Shared identifiers for an event-specific payload; additional fields depend on eventType.
    additionalProperties: true
    properties:
      customerId:
        type: integer
        format: int64
      productId:
        type: integer
        format: int64
      orderId:
        type: integer
        format: int64
      notificationId:
        type: integer
        format: int64

  # -------------------------
  # Customer
  # -------------------------

  Address:
    type: object
    properties:
      unitNumber:
        type: integer
        nullable: true
        minimum: 1
      streetNumber:
        type: integer
        minimum: 1
      street:
        type: string
      suburb:
        type: string
        nullable: true
      city:
        type: string
      postcode:
        type: integer
        minimum: 1
      state:
        type: string
      country:
        type: string
    required:
      - streetNumber
      - street
      - city
      - postcode
      - state
      - country

  CustomerCreateRequest:
    type: object
    required:
      - name
      - email
      - phone
      - address
    properties:
      name:
        type: string
      email:
        type: string
        format: email
      phone:
        type: string
        minLength: 1
        pattern: '^\\+?[0-9][0-9 ()-]{6,19}$'
      contactMethod:
        type: string
        enum: \[Email, Phone]
        default: Email
      address:
        $ref: '#/components/schemas/Address'

  CustomerUpdateRequest:
    type: object
    properties:
      name:
        type: string
      email:
        type: string
        format: email
      phone:
        type: string
        minLength: 1
        pattern: '^\\+?[0-9][0-9 ()-]{6,19}$'
      contactMethod:
        type: string
        enum: \[Email, Phone]
      address:
        $ref: '#/components/schemas/Address'

  CustomerResponse:
    allOf:
      - $ref: '#/components/schemas/CustomerCreateRequest'
      - type: object
        properties:
          customerId:
            type: integer
            format: int64

  AddressUpdateRequest:
    $ref: '#/components/schemas/Address'

  AddressResponse:
    allOf:
      - $ref: '#/components/schemas/Address'
      - type: object
        properties:
          customerId:
            type: integer
            format: int64

  # -------------------------
  # Basket
  # -------------------------

  BasketItem:
    type: object
    properties:
      productId:
        type: integer
        format: int64
      name:
        type: string
      price:
        type: number
        format: double
      quantity:
        type: integer
        minimum: 1
      subtotal:
        type: number
        format: double
    required:
      - productId
      - name
      - price
      - quantity
      - subtotal

  BasketResponse:
    type: object
    properties:
      customerId:
        type: integer
        format: int64
      items:
        type: array
        items:
          $ref: '#/components/schemas/BasketItem'
      total:
        type: number
        format: double
    required:
      - customerId
      - items
      - total

  BasketAddRequest:
    type: object
    required:
      - productId
      - quantity
    properties:
      productId:
        type: integer
        format: int64
      quantity:
        type: integer
        minimum: 1

  BasketRemoveRequest:
    type: object
    required:
      - productId
      - quantity
    properties:
      productId:
        type: integer
        format: int64
      quantity:
        type: integer
        minimum: 1

  # -------------------------
  # Product
  # -------------------------

  ProductCategory:
    type: string
    enum:
      - Electronics
      - Appliances
      - Furniture
      - Kitchen
      - Tools
      - Garden
      - Sports
      - Toys
      - Automotive
      - Pets
      - Apparel
      - Beauty
      - Grocery
      - Media
      - Professional
      - Lifestyle

  ProductCreateRequest:
    type: object
    required:
      - name
      - category
      - price
    properties:
      name:
        type: string
      category:
        $ref: '#/components/schemas/ProductCategory'
      price:
        type: number
        format: double
      description:
        type: string
        nullable: true

  ProductUpdateRequest:
    type: object
    properties:
      name:
        type: string
      category:
        $ref: '#/components/schemas/ProductCategory'
      price:
        type: number
        format: double
      description:
        type: string
        nullable: true

  ProductResponse:
    allOf:
      - $ref: '#/components/schemas/ProductCreateRequest'
      - type: object
        properties:
          productId:
            type: integer
            format: int64

  # -------------------------
  # Order
  # -------------------------

  OrderStatus:
    type: string
    enum:
      - Placed
      - Pending
      - InTransit
      - Delivered
      - Cancelled

  OrderItem:
    type: object
    properties:
      productId:
        type: integer
        format: int64
      name:
        type: string
      price:
        type: number
        format: double
      quantity:
        type: integer
        minimum: 1
      subtotal:
        type: number
        format: double
    required:
      - productId
      - quantity

  OrderCreateRequest:
    type: object
    required:
      - customerId
    properties:
      customerId:
        type: integer
        format: int64
      address:
        $ref: '#/components/schemas/Address'
      items:
        type: array
        items:
          $ref: '#/components/schemas/OrderItem'
    description: >
      If items are omitted, the order is created from the customer's basket.

  OrderStatusUpdateRequest:
    type: object
    required:
      - status
    properties:
      status:
        $ref: '#/components/schemas/OrderStatus'

  OrderResponse:
    type: object
    properties:
      orderId:
        type: integer
        format: int64
      customerId:
        type: integer
        format: int64
      address:
        $ref: '#/components/schemas/Address'
      items:
        type: array
        items:
          $ref: '#/components/schemas/OrderItem'
      total:
        type: number
        format: double
      status:
        $ref: '#/components/schemas/OrderStatus'
    required:
      - orderId
      - customerId
      - items
      - total
      - status

  # -------------------------
  # Notification
  # -------------------------

  NotificationCreateRequest:
    type: object
    required:
      - message
    properties:
      message:
        type: string

  NotificationBroadcastRequest:
    type: object
    required:
      - message
    properties:
      message:
        type: string

  NotificationAreaBroadcastRequest:
    type: object
    required:
      - message
    properties:
      message:
        type: string
      postcode:
        type: integer
        nullable: true
      state:
        type: string
        nullable: true
      country:
        type: string
        nullable: true

  NotificationResponse:
    type: object
    properties:
      notificationId:
        type: integer
        format: int64
      customerId:
        type: integer
        format: int64
      type:
        type: string
        enum: \[Email, Phone]
      message:
        type: string
      sentAt:
        type: string
        format: date-time
    required:
      - notificationId
      - customerId
      - type
      - message
      - sentAt

  # -------------------------
  # Error
  # -------------------------

  ErrorResponse:
    type: object
    properties:
      code:
        type: string
      message:
        type: string
      timestamp:
        type: string
        format: date-time

responses:
  BadRequest:
    description: Invalid request
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'
  NotFound:
    description: Resource not found
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'