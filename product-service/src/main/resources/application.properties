server.port=8082
spring.application.name=product-service
management.endpoints.web.exposure.include=health,metrics
spring.profiles.active=${SPRING_PROFILES_ACTIVE:ollama}

spring.datasource.url=jdbc:h2:file:./data/productdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jackson.serialization.indent-output=true

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.streams.application-id=product-projection-v1
spring.kafka.streams.properties.auto.offset.reset=earliest
spring.kafka.streams.properties.processing.guarantee=at_least_once
spring.kafka.streams.properties[default.deserialization.exception.handler]=com.retail.common.ProjectionDeserializationExceptionHandler
spring.kafka.streams.properties[retail.events.deserialization.dlt-topic]=product.projection.deserialization.dlt
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
retail.events.publishing.enabled=true
retail.events.outbox.enabled=true
retail.events.topic=product.events
retail.events.projection.dlt-topic=product.projection.dlt
retail.events.streams.enabled=${RETAIL_EVENTS_STREAMS_ENABLED:true}
retail.projection.replay.enabled=false

# Enabled by default; the "ollama" profile above configures the local Ollama chat model
retail.ai.recommendation.enabled=${AI_RECOMMENDATION_ENABLED:true}
# Avoid DEBUG by default to reduce risk of logging prompts or PII. Enable DEBUG
# only in local/dev profiles or via an explicit environment variable.
logging.level.dev.langchain4j=INFO
