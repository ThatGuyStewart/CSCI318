server.port=8081
spring.application.name=customer-service
management.endpoints.web.exposure.include=health,metrics

spring.datasource.url=jdbc:h2:file:./data/customerdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.serialization.indent-output=true

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.retail.common.DomainEventMessage
spring.kafka.consumer.properties.spring.json.trusted.packages=com.retail.common
spring.kafka.streams.application-id=customer-projection-v1
spring.kafka.streams.properties[auto.offset.reset]=earliest
spring.kafka.streams.properties[processing.guarantee]=at_least_once
spring.kafka.streams.properties[default.deserialization.exception.handler]=com.retail.common.ProjectionDeserializationExceptionHandler
spring.kafka.streams.properties[retail.events.deserialization.dlt-topic]=customer.projection.deserialization.dlt
retail.events.streams.enabled=${RETAIL_EVENTS_STREAMS_ENABLED:true}
retail.projection.replay.enabled=false
retail.events.publishing.enabled=true
retail.events.outbox.enabled=true
retail.events.topic=customer.events
retail.events.projection.dlt-topic=customer.projection.dlt
retail.events.consumer.enabled=true
retail.events.consumer.group-id=customer-projections
retail.events.consumer.dlt-topic=customer.consumer.dlt
retail.events.product-topic=product.events
retail.events.order-topic=order.events

product.service.url=http://localhost:8082
